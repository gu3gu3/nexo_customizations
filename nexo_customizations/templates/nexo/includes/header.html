<header class="nexo-header">
	<div class="container nexo-header__inner">
		<a href="/" class="nexo-brand">
			<img src="{{ nexo_branding.logo_url }}" alt="{{ nexo_branding.brand_name }}">
			<div>
				<strong>{{ nexo_branding.brand_name }}</strong>
				<small>{{ nexo_branding.portal_name }}</small>
			</div>
		</a>

		<nav class="nexo-header__actions">
			<a href="/login" class="btn btn-light btn-sm">Ingresar</a>
			<a href="{{ nexo_branding.whatsapp_url }}" class="btn btn-primary btn-sm" target="_blank" rel="noopener">
				WhatsApp
			</a>
		</nav>
	</div>
</header>
